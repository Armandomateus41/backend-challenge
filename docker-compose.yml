name: wagering

x-app-env: &app-env
  DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  LOG_LEVEL: info

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - '${POSTGRES_HOST_PORT:-55432}:5432'
    volumes:
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
      - postgres-data:/var/lib/postgresql/data
    command: ['postgres', '-c', 'max_connections=300']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wagering -d wagering']
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:4.4
    environment:
      SERVICES: sqs
      SQS_ENDPOINT_STRATEGY: path
    ports:
      - '${LOCALSTACK_HOST_PORT:-4566}:4566'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://localhost:4566/_localstack/health | grep -q "\"sqs\": \"\(available\|running\)\""',
        ]
      interval: 3s
      timeout: 3s
      retries: 40

  setup:
    build: .
    environment: *app-env
    command: ['sh', '-c', 'bun scripts/migrate.ts up && bun scripts/setup-queues.ts']
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  api:
    build: .
    environment:
      <<: *app-env
      INSTANCE_ID: api
      HTTP_PORT: '8080'
      SQS_CONSUMER_ENABLED: 'false'
      # Enable with AUTH_ENABLED=true and the 'auth' profile (Keycloak).
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_ISSUER: http://localhost:${KEYCLOAK_HOST_PORT:-8180}/realms/wagering
      AUTH_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
      AUTH_AUDIENCE: wagering-api
    ports:
      - '${API_HOST_PORT:-8080}:8080'
    depends_on:
      setup:
        condition: service_completed_successfully
    stop_grace_period: 30s

  worker:
    build: .
    environment:
      <<: *app-env
      HTTP_PORT: '8080'
      SQS_CONSUMER_ENABLED: 'true'
    deploy:
      replicas: 2
    depends_on:
      setup:
        condition: service_completed_successfully
    stop_grace_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    profiles: ['auth']
    command: ['start-dev', '--import-realm']
    environment:
      # Local development credentials only.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '${KEYCLOAK_HOST_PORT:-8180}:8080'
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 40

volumes:
  postgres-data:
